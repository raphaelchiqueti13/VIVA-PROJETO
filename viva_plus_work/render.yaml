services:
  - type: web
    name: viva-plus
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_PATH
        value: /var/data/viva.sqlite
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
    disk:
      name: viva-plus-data
      mountPath: /var/data
      sizeGB: 1
